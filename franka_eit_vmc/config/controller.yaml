# ROS 2 parameter file. SI units. Geometry is an EXAMPLE until measured.
/**:
  ros__parameters:
    robot_ip: '192.168.8.185'
    joint_prefix: 'fr3_'
    tool_transform_confirmed: true
    mount_orientation_confirmed: true
    ee_to_pad_m: [0.0, 0.0, 0.05]  # measured EE-to-active-face offset
    tool_weight_compensation_mass_kg: 0.5 # +4.903325 N in Base Z at EE in all normal modes; 0 disables
    # User-confirmed -90 deg pad clocking in the current EE frame:
    # pad +X points toward EE -Y, with the corrected 50 mm axial offset.
    ee_R_pad_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
    ready_pad_yaw_rad: 1.1780972450961724  # CCW contacting-face midpoint 4–5 faces Base +X (67.5 deg)
    ready_pad_position_m: [0.45, 0.0, 0.1575]
    landing_offset_x_m: 0.0        # joystick comparison varies Base X; task centre remains Y=0
    landing_offset_y_m: 0.0
    workspace_min_m: [0.15, -0.18, 0.05]
    workspace_max_m: [0.75, 0.18, 0.70]
    # False = capture current q, matching the VMC Transformer convention.
    # capture_posture.py creates an overlay containing true and seven measured joints.
    use_saved_posture: false
    joint_speed_limit: 1.5
    point_speed_limit: 1.0
    angular_speed_limit: 2.0
    heartbeat_timeout: 0.50
    max_period: 0.010       # seconds during robot motion
    idle_max_period: 0.020  # seconds while holding or done
    sensor_timeout: 0.30
    contact_topic: '/eit/contact'
    pad_frame: 'eit_pad'
    pad_numbering: 'ccw'
    active_radius: 0.045     # m; 90 mm sensor pad diameter, centre to allowed contact edge
    # JOYSTICK TRIAL: Hold -> Ready -> Hold -> Approach -> Preload ->
    # Interact -> Retract -> Done. The block runner repeats this for baseline
    # and EIT. A fault interrupts the sequence instead of advancing it.
    # k = translation spring (N/m); d = translation damping (N.s/m).
    # kr = rotation spring (Nm/rad); dr = rotation damping (Nm.s/rad).
    # These are requested controller forces/moments, not measured contact load.
    # 1. HOLD: hold the current pad pose at startup, or the ready pose after
    #    Ready finishes. Wait here for the next motion command.
    hold_k: 1500.0          # N/m position spring
    hold_d: 35.0            # N.s/m velocity damping
    hold_kr: 30.0           # Nm/rad orientation spring
    hold_dr: 3.0            # Nm.s/rad angular damping
    moment_limit: 5.0       # Nm requested orientation-moment cap

    # 2. READY: lift, translate above the joystick, then descend to the
    #    ready_pad_position_m plus landing offsets specified above/overlaid.
    #    This pose is intended to remain above the joystick, before contact.
    #    When settled, the controller returns to Hold at this ready pose.
    ready_speed: 0.015      # m/s trajectory speed
    ready_angular_speed: 0.12 # rad/s trajectory angular speed
    ready_k: 5000.0         # N/m position spring
    ready_d: 60.0           # N.s/m velocity damping
    ready_kr: 150.0          # Nm/rad
    ready_dr: 8.0           # Nm.s/rad
    ready_moment_limit: 5.0 # Nm cap on requested orientation moment

    # 3. APPROACH: move straight down from Ready. At the first EIT contact
    #    report, descend slowly by contact_travel while contact stays valid.
    #    Enter Preload only after the confirmation time, two sensor frames,
    #    and the available bounded commanded descent (clipped by the approach
    #    distance limit). A contacting pad may resist
    #    the motion, so measured pad travel is not required.
    #    If EIT contact disappears, resume descent within the distance/time
    #    limits. Translation uses hold_k/d from stage 1; rotation uses the
    #    gains below. The contact decision comes from eit.json and the model.
    approach_speed: 0.01    # m/s downward trajectory speed
    approach_distance: 0.020 # m maximum commanded descent for joystick; ball searches to workspace_min_m Z
    approach_timeout: 8.0    # s base timeout; ball also allows nominal travel time from its Ready height
    approach_contact_confirm_s: 0.25 # s stable contact before preload
    approach_contact_speed: 0.005 # m/s during provisional contact
    approach_contact_travel_m: 0.001 # m extra commanded descent before preload
    approach_kr: 300.0          # Nm/rad
    approach_dr: 5.0           # Nm.s/rad
    approach_moment_limit: 15.0 # Nm cap on requested orientation moment

    # 4. PRELOAD (legacy joystick / ball): after confirmed EIT contact, engage the contact-point
    #    spring/damper immediately; ball normal force blends from the bounded
    #    approach command to preload, then waits for loaded contact to settle. The
    #    orientation target stays at the approach target, with no joystick
    #    angle motion yet. Rotation still uses approach_kr/dr and its limit.
    preload: 3.0            # N; legacy joystick/ball only. Ignored by inward_arc.
    preload_time: 0.55      # s ramp duration from first contact
    coupling_k: 3500.0      # LEGACY JOYSTICK / BALL: N/m horizontal contact-point spring
    coupling_d: 30.0        # LEGACY JOYSTICK / BALL: N.s/m horizontal contact-point damping
    normal_k: 800.0         # LEGACY JOYSTICK / BALL: N/m vertical contact-point spring
    normal_d: 60.0          # LEGACY JOYSTICK / BALL: N.s/m vertical contact-point damping
    force_xy_limit: 15.0    # LEGACY JOYSTICK / BALL: N cap per horizontal force component
    normal_force_limit: 4.0 # N vertical cap: legacy joystick / ball after confirmed contact
    # 5. INTERACT (legacy joystick / ball): joystick.yaml commands +angle, -angle, then zero.
    #    Translation keeps coupling_k/d and normal_k/d from Preload, while
    #    rotation switches to the softer gains below and moment_limit from
    #    Hold. Baseline attaches at pad centre; EIT attaches at the detected
    #    location when contact first begins.
    orientation_k: 3.0      # Nm/rad; legacy joystick/ball only during contact
    orientation_d: 1.0      # Nm.s/rad; legacy joystick/ball only during contact

    # OPTIONAL JOYSTICK MECHANISM (selectable by run_block.py --mechanism).
    # legacy preserves the existing controller. inward_arc shortens BOTH the
    # task arc and current-shaft alignment radius and removes world-Z preload.
    # Geometry/guide gains below are ONLY USED by inward_arc. Feedback topic/
    # timeout also label/check recorded diagnostics in legacy, without controlling it.
    # Hold/Ready/Approach/Retract keep their existing gains in either mode.
    joystick_mechanism: 'legacy'   # legacy | inward_arc; change only in Hold/Done
    joystick_inward_arc_m: 0.010   # NEW ONLY: metres inward for BOTH virtual radii;
                                  # require 0 <= depth < physical joystick_length.
                                  # With L=0.1025, virtual radius is 0.0925 m.
    joystick_pivot_m: [0.45, 0.0, 0.035] # INWARD ARC / KINEMATIC: measured physical pivot in Base.
                                  # Extended shaft: upright tip Z=.1375 minus L=.1025.
                                  # Keep fixed for all landing-offset blocks.
    joystick_task_spring_k: 1000.0 # NEW ONLY: one scalar stiffness for XYZ, N/m
    joystick_task_spring_d: 10.0   # NEW ONLY: one scalar damper for XYZ, Ns/m
    joystick_task_spring_uses_shaft: false # Force from pad attachment to moving arc target; shaft feedback monitors slip
    joystick_update_eit_attachment: true # EIT only: follow the current contact; baseline stays at pad centre
    joystick_attachment_filter_tau_s: 0.080 # Two low-pass stages, 80 ms each; larger = smoother but more lag
    joystick_slip_contact_mismatch_m: 0.020 # EIT contact: pad >20 mm ahead of shaft along commanded displacement
    joystick_slip_confirm_s: 0.06 # Require that evidence for 60 ms before ending the trial
    joystick_task_spring_force_limit: 15.0 # NEW ONLY: N, elastic vector-norm cap
    # joystick_alignment_enabled is selected in joystick.yaml (task configuration).
    joystick_alignment_half_span_m: 0.160 # NEW ONLY: virtual anchors 160 mm from centre; 320 mm across
    joystick_alignment_spring_k: 50.0  # NEW ONLY: N/m PER alignment link (4 links)
    joystick_alignment_spring_d: 1.0   # NEW ONLY: Ns/m PER alignment link
    joystick_alignment_spring_force_limit: 20.0 # NEW ONLY: N PER LINK, elastic vector-norm cap
    # Damper forces are separate and uncapped. No cap is applied to the sum.
    joystick_slider_radius_m: 0.05 # NEW ONLY: virtual palm-slider travel, m; independent of EIT active_radius
    joystick_feedback_topic: '/joystick/shaft' # NEW CONTROL ONLY; also recorded in legacy
    joystick_feedback_timeout: 0.20 # NEW CONTROL ONLY: seconds; bad feedback stops inward_arc.
                                  # In legacy this only labels feedback freshness.
    # Inward-arc only: combined EIT no-contact + a rapid return toward upright
    # ends this trial as unsuccessful, retracts, and allows the next condition.
    joystick_release_drop_deg: 10.0
    joystick_release_upright_deg: 5.0
    joystick_release_min_command_deg: 10.0
    joystick_release_window_s: 0.10
    # NEW MODE uses the independent spring parameters above, preload_time
    # and moment_limit. Each elastic spring saturates before its damper is added.
    # The task and alignment forces are added WITHOUT a resultant-force cap.
    # Hold/Ready/Approach/Retract use their separate PD laws and moment caps.
    # preload and orientation_k/d are NOT used by the new contact mechanism.
    # The current ESP32 calibration ends at +/-35 deg. Set joystick_angle_deg
    # below 35 in joystick.yaml; ADC-rail angles are bounded estimates.

    # 6. RETRACT: move upward, using ready_k/d for translation and hold_kr/dr
    #    plus moment_limit for rotation. DONE then holds the final pose with
    #    the Hold gains until another Ready command arrives.
    retract_distance: 0.015 # m upward distance

    # Joint posture assistance throughout all active stages.
    null_k: 2.0
    null_d: 1.0
    use_eit: true
    update_ball_attachment: false
